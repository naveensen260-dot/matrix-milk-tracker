name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MATRIX_Milk_Tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MATRIX-Milk-APK
          path: MATRIX_Milk_Tracker.apk
